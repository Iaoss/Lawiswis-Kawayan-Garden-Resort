<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b4636" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Resort Staff" />
    <link rel="manifest" href="/staff-manifest.json" />
    <link rel="apple-touch-icon" href="/lawiswis-logo.png" />
    <title>Install the Staff Portal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f4f6f4;
        color: #1f2937;
        font: 16px/1.6 Arial, sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 28px;
        box-sizing: border-box;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 36px #1f293714;
      }
      h1 { margin: 0 0 12px; font-size: 23px; }
      p { color: #52605a; }
      a {
        display: block;
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #3b4636;
        color: #fff;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      .hint { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lawiswis Kawayan Staff Portal</h1>
      <p>Install this staff shortcut to open directly at staff sign-in instead of the guest website.</p>
      <p class="hint">In your browser menu, choose <strong>Install app</strong> or <strong>Add to Home screen</strong>. After installation, sign in with your staff account.</p>
      <a href="/admin/login">Open staff sign-in</a>
    </main>
  </body>
</html>
